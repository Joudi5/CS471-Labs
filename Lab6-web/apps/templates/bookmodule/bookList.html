{% extends "layouts/base.html" %}
{% load static %}

{% block title %} Book List {% endblock title %}

{% block content %}

<h2>Search Results</h2>

{% for book in books %}
    <p>
        <strong>ID:</strong> {{ book.id }} <br>
        <strong>Title:</strong> {{ book.title }} <br>
        <strong>Author:</strong> {{ book.author }}
    </p>
    <hr>
{% empty %}
    <p>No books found.</p>
{% endfor %}

{% endblock content %}
